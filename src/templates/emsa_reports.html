<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes EMSA</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/emsa_reports.css">
</head>

<body>

  <div class="page-container">

    <!-- HEADER -->
    <header class="topbar">
      <h1>Reportes EMSA</h1>
      <p>Gestión de incidencias ciudadanas</p>
    </header>

    <!-- FILTROS -->
    <section class="filters-section">

      <div class="filters-container">

        <!-- STATUS -->
        <div class="filter-group">
          <label>Estado</label>

          <select id="statusFilter">
            <option value="">Todos</option>
            <option value="Pending">Pendiente</option>
            <option value="Completed">Completado</option>
          </select>
        </div>

        <!-- FECHA -->
        <div class="filter-group">
          <label>Fecha mínima</label>

          <input type="date" id="dateFilter">
        </div>

        <!-- UBICACIÓN -->
        <div class="filter-group">
          <label>Ubicación</label>

          <input
            type="text"
            id="locationFilter"
            placeholder="Ej: Zona Norte"
          >
        </div>

        <!-- BOTÓN -->
        <button id="filterButton" class="filter-btn">
          Filtrar
        </button>
        
        <button id="clearButton" class="clear-btn">
          Limpiar
        </button>
      </div>

    </section>

    <!-- REPORTES -->
    <main>
      <div id="reportsContainer" class="reports-container"></div>
    </main>

  </div>

  <script
    type="module"
    src="../functions/EMSA/Emsa.Reports.presenter.js">
  </script>

</body>
</html>
