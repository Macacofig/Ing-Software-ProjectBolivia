<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mis Reportes</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../styles/citizen_reports.css"
  >
</head>

<body>

  <div class="page-container">

    <!-- HEADER -->
    <header class="topbar">
      <h1>Mis Reportes</h1>
      <p>Historial de incidencias registradas</p>
    </header>

    <!-- FILTROS -->
    <section class="filters-section">

      <div class="filters-container">

        <!-- ID CIUDADANO -->
        <div class="filter-group">
          <label>ID Ciudadano</label>

          <input
            type="text"
            id="idCitizenFilter"
            placeholder="Ej: 10234"
          >
        </div>

        <!-- FECHA -->
        <div class="filter-group">
          <label>Fecha mínima</label>

          <input
            type="date"
            id="dateFilter"
          >
        </div>

        <!-- BOTONES -->
        <button
          id="filterButton"
          class="filter-btn"
        >
          Filtrar
        </button>

        <button
          id="clearButton"
          class="clear-btn"
        >
          Limpiar
        </button>

      </div>

    </section>

    <!-- REPORTES -->
    <main>
      <div
        id="reportsContainer"
        class="reports-container"
      ></div>
    </main>

  </div>

  <script
    type="module"
    src="../functions/CITIZEN/Citizen.Reports.presenter.js"
  ></script>

</body>
</html>
