<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/Register_Users.css">

    <title>Register User</title>

</head>

<body>

    <div class="container">

        <form id="registerForm" class="form">

            <h1>Register User</h1>

            <input
                type="text"
                id="name"
                placeholder="Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <select id="role">

                <option value="">Select Role</option>

                <option value="citizen">
                    Citizen
                </option>

                <option value="emsa">
                    EMSA
                </option>

            </select>

            <!-- hidden zone -->
            <div
                id="keyContainer"
                class="hidden"
            >

                <input
                    type="text"
                    id="key"
                    placeholder="EMSA Key"
                >

            </div>

            <button type="submit">
                Register
            </button>

            <p id="messageBox"></p>

        </form>

    </div>

    <script type="module" src="../functions/Users/User.Register.presenter.js"></script>

</body>

</html>
