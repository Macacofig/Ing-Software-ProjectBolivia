<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSA - Home Ciudadano</title>

    <!-- 1. Agregamos el CSS base y el nuevo CSS oscuro del Sidebar Ciudadano -->
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/citizen_sidebar.css">

    <!-- Tu CSS específico de esta vista -->
    <link rel="stylesheet" href="../styles/user_home.css">

    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="citizen-theme">

    <!-- 2. Envolvemos todo en el layout principal -->
    <div class="main-layout">

        <!-- 3. AQUÍ SE INYECTA EL SIDEBAR DEL CIUDADANO -->
        <div id="sidebar-container"></div>

        <!-- 4. Contenido original, lo hacemos flexible y scrolleable -->
        <main class="content-area split-layout">
            
            <!-- PANEL IZQUIERDO: Búsqueda y Resultados -->
            <div class="left-panel">

            <!-- HEADER -->
            <header class="main-header">
                <h1 class="titulo">EMSA</h1>
            </header>

            <!-- FILTROS -->
            <section class="filters">
                <form class="filter-bar">

                    <!-- DISTRITO -->
                    <label>
                        <span>Distrito</span>
                        <select id="filter-distrito">
                            <option value="">Seleccionar</option>
                            <option value="2">Distrito 2</option>
                            <option value="6">Distrito 6</option>
                            <option value="7">Distrito 7</option>
                            <option value="8">Distrito 8</option>
                            <option value="9">Distrito 9</option>
                            <option value="15">Distrito 15</option>
                        </select>
                    </label>

                    <!-- ZONA -->
                    <label>
                        <span>Zona</span>
                        <select id="filter-zona">
                            <option value="">Seleccionar</option>
                        </select>
                    </label>

                    <!-- DÍA -->
                    <label>
                        <span>Día</span>
                        <select id="filter-dia">
                            <option value="">Seleccionar</option>
                            <option value="lunes">Lunes</option>
                            <option value="martes">Martes</option>
                            <option value="miércoles">Miércoles</option>
                            <option value="jueves">Jueves</option>
                            <option value="viernes">Viernes</option>
                            <option value="sabado">Sábado</option>
                            <option value="domingo">Domingo</option>
                        </select>
                    </label>

                    <button type="button" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>

                </form>
            </section>

            <!-- RESULTADOS -->
            <section class="results">
                <h2 class="subtitulo">Días de Servicio</h2>
                <div id="grid-cards" class="grid-cards"></div>
            </section>
            </div>

            <!-- PANEL DERECHO: Mapa de Distritos -->
            <div class="right-panel">
                <div class="map-card glass-card">
                    <h2 class="map-title"><i class="fas fa-map-marked-alt"></i> Zonas y Distritos</h2>
                    <p class="map-desc">Encuentra tu distrito en el mapa para usar los filtros correctamente.</p>
                    <div class="map-image-container" onclick="openMapModal()">
                        <img src="../assets/mapa_distritos.jpg" alt="Mapa de Distritos EMSA" class="map-image" id="sourceMapImage">
                        <div class="map-overlay">
                            <i class="fas fa-search-plus"></i> Ampliar
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal del Mapa -->
    <div id="mapModal" class="map-modal-overlay">
        <span class="close-modal" onclick="closeMapModal()">&times;</span>
        <img class="modal-content-img" id="expandedImg">
    </div>

    <!-- 5. Script para cargar el sidebar y resaltar "Rutas y Horarios" -->
    <script type="module">
        // ¡RUTA CORREGIDA AQUÍ!
        import { loadSidebar } from '../utils/sidebar_loader.js';

        // El motor busca el ID 'menu-citizen-home' en tu archivo citizen_sidebar.html y lo ilumina
        loadSidebar('citizen', 'menu-citizen-home');
    </script>

    <!-- Tu presentador original -->
    <script type="module" src="../functions/Citizen/Citizen.Service.presenter.js"></script>

    <!-- Script del Modal del Mapa -->
    <script>
        function openMapModal() {
            const modal = document.getElementById("mapModal");
            const modalImg = document.getElementById("expandedImg");
            const sourceImg = document.getElementById("sourceMapImage");
            
            modal.style.display = "flex";
            // Forzar reflow para animación
            setTimeout(() => {
                modal.classList.add("show");
            }, 10);
            modalImg.src = sourceImg.src;
        }

        function closeMapModal() {
            const modal = document.getElementById("mapModal");
            modal.classList.remove("show");
            setTimeout(() => {
                modal.style.display = "none";
            }, 300);
        }

        // Cerrar al hacer clic fuera de la imagen
        document.getElementById("mapModal").addEventListener('click', function(e) {
            if (e.target === this) {
                closeMapModal();
            }
        });
    </script>
</body>

</html>
