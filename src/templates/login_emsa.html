<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login EMSA</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/emsa_sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-layout" style="display:flex; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:24px; padding:40px; width:400px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);">
            <h2 style="text-align:center; margin-bottom:30px; color:#FE8330;">EMSA Admin Login</h2>

            <div style="margin-bottom:15px;">
                <label style="font-size:13px; color:#555;">Email</label>
                <input type="email" id="email" placeholder="admin@emsa.com">
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-size:13px; color:#555;">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <div id="error-message" style="display:none; color:#e74c3c; font-size:13px; margin-bottom:15px; text-align:center;"></div>

            <button id="login-btn" style="width:100%; background:#FE8330; color:white; padding:14px; border-radius:12px; border:none; cursor:pointer; font-weight:600; font-size:15px;">
                Ingresar
            </button>
        </div>
    </div>
    <script type="module" src="../functions/EMSA/Emsa.Login.presenter.js"></script>
</body>
</html>
